<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@motifx-community/devtools · basic example</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; margin: 0; color: #1d2433; background: #f6f7f9; }
      header { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1.5rem; background: #fff; border-bottom: 1px solid #e3e5e8; }
      header nav { display: flex; gap: 0.5rem; }
      main { padding: 1.5rem; display: grid; gap: 1.5rem; }
      .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
      .card { background: #fff; border: 1px solid #e3e5e8; border-radius: 8px; padding: 1rem; }
      .card.positive b { color: #1f883d; }
      .card.negative b { color: #cf222e; }
      table { width: 100%; border-collapse: collapse; background: #fff; }
      td, th { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #eef0f2; }
      button { font: inherit; padding: 0.3rem 0.8rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>globalThis.__MOTIF_DEV__ = true;</script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
